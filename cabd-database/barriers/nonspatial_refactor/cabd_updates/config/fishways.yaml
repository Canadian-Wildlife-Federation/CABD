feature: fishways
staging_table: cabd.fishway_updates

column_types:
  cabd_id: uuid
  dam_id: uuid
  structure_name_en: varchar
  structure_name_fr: varchar
  waterbody_name_en: varchar
  waterbody_name_fr: varchar
  river_name_en: varchar
  river_name_fr: varchar
  province_territory_code: varchar
  monitoring_equipment: text
  architect: text
  contracted_by: text
  constructed_by: text
  plans_held_by: text
  purpose: text
  designed_on_biology: boolean
  length_m: real
  elevation_m: real
  gradient: real
  depth_m: real
  modified: boolean
  modification_year: smallint
  modification_purpose: text
  year_constructed: smallint
  operated_by: text
  operation_period: text
  has_evaluating_studies: boolean
  nature_of_evaluation_studies: text
  engineering_notes: text
  operating_notes: text
  mean_fishway_velocity_ms: real
  max_fishway_velocity_ms: real
  estimate_of_attraction_pct: real
  estimate_of_passage_success_pct: real
  fishway_reference_id: varchar
  latitude: numeric
  longitude: numeric
  entry_classification: varchar
  data_source_short_name: varchar
  status: varchar
  reviewer_comments: varchar
  submitted_on: timestamp with time zone
  known_notuse: varchar
  known_use: varchar

