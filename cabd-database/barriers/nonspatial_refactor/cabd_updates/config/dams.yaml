feature: dams
staging_table: cabd.dam_updates

column_types:
  cabd_id: uuid
  dam_name_en: varchar
  waterbody_name_en: varchar
  waterbody_name_fr: varchar
  reservoir_name_en: varchar
  reservoir_name_fr: varchar
  province_territory_code: varchar
  owner: varchar
  provincial_compliance_status: varchar
  federal_compliance_status: varchar
  operating_notes: text
  construction_year: numeric
  removed_year: numeric
  assess_schedule: varchar
  expected_end_of_life: smallint
  maintenance_last: date
  maintenance_next: date
  height_m: real
  length_m: real
  spillway_capacity: double precision
  reservoir_present: boolean
  reservoir_area_skm: real
  reservoir_depth_m: real
  storage_capacity_mcm: double precision
  avg_rate_of_discharge_ls: double precision
  degree_of_regulation_pc: real
  provincial_flow_req: double precision
  federal_flow_req: double precision
  hydro_peaking_system: boolean
  generating_capacity_mwh: double precision
  turbine_number: smallint
  passability_status_note: text
  use_analysis: boolean
  facility_name_en: varchar
  latitude: numeric
  longitude: numeric
  entry_classification: varchar
  data_source_short_name: varchar
  status: varchar
  reviewer_comments: varchar
  submitted_on: timestamp with time zone

