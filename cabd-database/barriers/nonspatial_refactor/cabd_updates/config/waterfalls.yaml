  - latitude
  - longitude
  - province_territory_code
  - entry_classification
  - data_source_short_name
  - status
  - reviewer_comments
  - submitted_on
  - fall_name_en
  - fall_name_fr
  - waterbody_name_en
  - waterbody_name_fr
  - fall_height_m
